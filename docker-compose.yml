# Postgres always; web + worker + migrate only under `--profile prod`.
# Dev runs the app natively (pnpm dev:all) against this database.

name: foray

services:
  db:
    image: pgvector/pgvector:pg18
    # pgvector is unused in Phase 1; having the extension available means enabling
    # embeddings later is a migration, not a container swap.
    environment:
      POSTGRES_USER: foray
      POSTGRES_PASSWORD: foray
      POSTGRES_DB: foray
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images keep data in a major-version subdirectory, so the
      # mount goes one level up from the old /var/lib/postgresql/data.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foray -d foray']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    profiles: ['prod']
    build:
      context: .
      target: worker
    command: ['node_modules/.bin/tsx', 'src/lib/db/migrate.ts']
    env_file: .env
    environment:
      DATABASE_URL: postgres://foray:foray@db:5432/foray
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    profiles: ['prod']
    build:
      context: .
      target: web
    env_file: .env
    environment:
      DATABASE_URL: postgres://foray:foray@db:5432/foray
      HOSTNAME: '0.0.0.0'
      PORT: '3000'
    ports:
      - '3000:3000'
    volumes:
      - storage-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ['prod']
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://foray:foray@db:5432/foray
    volumes:
      - storage-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  storage-data:
